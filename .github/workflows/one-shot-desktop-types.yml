name: One-shot desktop strict type repair

on:
  push:
    branches:
      - codex/agentic-runtime-kaizen-v1
    paths:
      - .github/workflows/one-shot-desktop-types.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.repository_owner == 'dominator509' && github.actor == 'dominator509'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
          run_install: false

      - run: pnpm install --frozen-lockfile

      - name: Use strict index-signature access for DOM dataset fields
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/desktop/src/main.ts")
          text = path.read_text(encoding="utf-8")
          replacements = [
              ('.dataset.taskId', '.dataset["taskId"]', 2),
              ('.dataset.phase', '.dataset["phase"]', 2),
              ('.dataset.viewPanel', '.dataset["viewPanel"]', 1),
              ('.dataset.detailPanel', '.dataset["detailPanel"]', 1),
              ('.dataset.detailTab', '.dataset["detailTab"]', 2),
              ('.dataset.view', '.dataset["view"]', 2),
          ]
          for before, after, expected in replacements:
              count = text.count(before)
              if count != expected:
                  raise SystemExit(
                      f"Expected {expected} occurrence(s), found {count}: {before!r}"
                  )
              text = text.replace(before, after)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Format and verify the native frontend
        run: |
          pnpm exec prettier --write \
            apps/desktop/src/main.ts \
            apps/desktop/tsconfig.frontend.json \
            apps/desktop/scripts/build-frontend.mjs
          pnpm --filter @the-machine/desktop lint
          pnpm --filter @the-machine/desktop build

      - name: Commit the bounded repair
        run: |
          git config user.name "The Machine CI"
          git config user.email "ci@themachine.dev"
          git add \
            apps/desktop/src/main.ts \
            apps/desktop/tsconfig.frontend.json \
            apps/desktop/scripts/build-frontend.mjs
          git commit -m "fix(desktop): satisfy strict DOM dataset access"
          git pull --rebase origin codex/agentic-runtime-kaizen-v1
          git push origin HEAD:codex/agentic-runtime-kaizen-v1
