name: CI — The Machine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: machine-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
          run_install: false

      - name: Show toolchain
        run: node --version && pnpm --version && git --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Preflight
        run: ./scripts/preflight.sh

      - name: Lint
        run: ./scripts/lint.sh

      - name: Format check
        run: ./scripts/format-check.sh

      - name: Typecheck
        run: ./scripts/typecheck.sh

      - name: Unit tests
        run: ./scripts/test-unit.sh

      - name: Integration tests
        run: ./scripts/test-integration.sh

      - name: Build all packages and apps
        run: ./scripts/build.sh

      - name: E2E tests
        run: ./scripts/test-e2e.sh

      - name: Benchmark smoke suite
        run: pnpm run benchmark:smoke

      - name: Security check
        run: ./scripts/security-check.sh

      - name: Dependency audit
        run: ./scripts/dependency-audit.sh

      - name: Build release artifacts
        run: pnpm run build:release

      - name: Smoke test
        run: ./scripts/smoke-test.sh

      - name: Production readiness
        run: pnpm run production:readiness
