name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 0.2.0-rc.1)"
        required: true
        type: string
      dry_run:
        description: "Dry run — build but do not tag or publish"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  build:
    name: Build Release Candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Full verification
        run: ./scripts/verify.sh

      - name: Build release artifacts
        run: pnpm run build:release

      - name: Smoke test release artifacts
        run: ./scripts/smoke-test.sh

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.version }}
          path: release/
          if-no-files-found: error

      - name: Check dry-run mode
        if: inputs.dry_run == 'true'
        run: echo "Dry run complete — artifacts built, smoke passed. No tag or publish occurred."

      - name: Tag release candidate
        if: inputs.dry_run == 'false'
        run: |
          git config user.name "The Machine CI"
          git config user.email "ci@themachine.dev"
          git tag -a "v${{ inputs.version }}" -m "Release candidate v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Publish notice
        if: inputs.dry_run == 'false'
        run: |
          echo "Tag v${{ inputs.version }} pushed."
          echo "To publish, run: pnpm publish --dry-run (requires npm token and explicit approval)"
