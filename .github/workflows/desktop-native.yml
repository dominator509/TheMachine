name: Native desktop console

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/cli/**"
      - "packages/agent-runtime/**"
      - "tools/release/collect-native-artifacts.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop-native.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/cli/**"
      - "packages/agent-runtime/**"
      - "tools/release/collect-native-artifacts.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: machine-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Tauri ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.13.1"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.6.0
          run_install: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libssl-dev

      - name: Require committed Rust lockfile
        run: >-
          node -e "if (!require('node:fs').existsSync('apps/desktop/src-tauri/Cargo.lock')) {
          console.error('apps/desktop/src-tauri/Cargo.lock must be committed before native verification');
          process.exit(1); }"

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Verify version identity
        run: pnpm run version:check

      - name: Build native frontend
        run: pnpm --filter @the-machine/desktop build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      - name: Test native bridge
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

      - name: Clippy native bridge
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Build native installer bundle
        run: pnpm --filter @the-machine/desktop tauri build

      - name: Collect digest-bound installers
        run: >-
          node tools/release/collect-native-artifacts.mjs
          --source apps/desktop/src-tauri/target/release/bundle
          --output artifacts/native
          --platform "${{ runner.os }}"
          --arch "${{ runner.arch }}"
          --candidate "${{ github.sha }}"

      - name: Upload native installer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: artifacts/native/
          if-no-files-found: error
          retention-days: 30
