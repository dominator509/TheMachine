name: Native desktop console

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/cli/**"
      - "packages/agent-runtime/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop-native.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/cli/**"
      - "packages/agent-runtime/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: machine-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Tauri ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
          run_install: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libssl-dev

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Build native frontend
        run: pnpm --filter @the-machine/desktop build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      - name: Test native bridge
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

      - name: Clippy native bridge
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Build Tauri application without installer bundle
        run: pnpm --filter @the-machine/desktop tauri build --no-bundle
