name: One-shot runtime strict type repair

on:
  push:
    branches:
      - codex/agentic-runtime-kaizen-v1
    paths:
      - .github/workflows/one-shot-runtime-typecheck.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.repository_owner == 'dominator509' && github.actor == 'dominator509'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
          run_install: false

      - run: pnpm install --frozen-lockfile

      - name: Repair exact optional-property and status-narrowing defects
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_checked(text: str, before: str, after: str, expected: int = 1) -> str:
              count = text.count(before)
              if count != expected:
                  raise SystemExit(
                      f"Expected {expected} occurrence(s), found {count}: {before!r}"
                  )
              return text.replace(before, after)

          registry = Path("packages/agent-runtime/src/commands/registry.ts")
          text = registry.read_text(encoding="utf-8")
          text = replace_checked(
              text,
              "  return {\n    executable: base.executable,",
              "  const timeoutMs = options.timeoutMs ?? entry.timeoutMs;\n  return {\n    executable: base.executable,",
          )
          text = replace_checked(
              text,
              "    timeoutMs: options.timeoutMs ?? entry.timeoutMs,\n",
              "    ...(timeoutMs !== undefined ? { timeoutMs } : {}),\n",
          )
          text = replace_checked(
              text,
              "    maxOutputBytes: options.maxOutputBytes,\n",
              "    ...(options.maxOutputBytes !== undefined\n      ? { maxOutputBytes: options.maxOutputBytes }\n      : {}),\n",
          )
          registry.write_text(text, encoding="utf-8")

          orchestrator = Path("packages/agent-runtime/src/engine/orchestrator.ts")
          text = orchestrator.read_text(encoding="utf-8")
          text = replace_checked(
              text,
              "\nfunction isCompiled(",
              "\nfunction currentRunStatus(manifest: RunManifest): RunManifest[\"status\"] {\n  return manifest.status;\n}\n\nfunction isCompiled(",
          )
          text = replace_checked(
              text,
              '          if (manifest.status === "cancelled") break;',
              '          if (currentRunStatus(manifest) === "cancelled") break;',
          )
          text = replace_checked(
              text,
              '          if (manifest.status === "awaiting_approval") return completedOutcome(manifest);',
              '          if (currentRunStatus(manifest) === "awaiting_approval") {\n            return completedOutcome(manifest);\n          }',
          )
          text = replace_checked(
              text,
              "        planPolicy: compiled.plan.policy,",
              "        ...(compiled.plan.policy ? { planPolicy: compiled.plan.policy } : {}),",
          )
          text = replace_checked(
              text,
              "      planPolicy: compiled.plan.policy,",
              "      ...(compiled.plan.policy ? { planPolicy: compiled.plan.policy } : {}),",
          )
          orchestrator.write_text(text, encoding="utf-8")
          PY

      - name: Format and verify runtime package
        run: |
          pnpm exec prettier --write \
            packages/agent-runtime/src/commands/registry.ts \
            packages/agent-runtime/src/engine/orchestrator.ts
          pnpm --filter @the-machine/agent-runtime lint
          pnpm --filter @the-machine/agent-runtime typecheck

      - name: Commit the bounded repair
        run: |
          git config user.name "The Machine CI"
          git config user.email "ci@themachine.dev"
          git add \
            packages/agent-runtime/src/commands/registry.ts \
            packages/agent-runtime/src/engine/orchestrator.ts
          git commit -m "fix(runtime): satisfy strict optional and status semantics"
          git pull --rebase origin codex/agentic-runtime-kaizen-v1
          git push origin HEAD:codex/agentic-runtime-kaizen-v1
