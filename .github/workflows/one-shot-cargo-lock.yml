name: One-shot native repair

on:
  push:
    branches:
      - agent/production-readiness-remediation
    paths:
      - .github/workflows/one-shot-cargo-lock.yml
      - apps/desktop/src-tauri/Cargo.toml
      - apps/desktop/src-tauri/src/lib.rs
      - packages/service/src/handlers/repoHandler.ts
      - tests/unit/plugin-sdk.unit.test.ts
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/one-shot-cargo-lock.yml
      - apps/desktop/src-tauri/Cargo.toml
      - apps/desktop/src-tauri/src/lib.rs
      - packages/service/src/handlers/repoHandler.ts
      - tests/unit/plugin-sdk.unit.test.ts
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.repository_owner == 'dominator509' && github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Commit deterministic source migrations first
        run: |
          python - <<'PY'
          from pathlib import Path

          rust_path = Path("apps/desktop/src-tauri/src/lib.rs")
          rust = rust_path.read_text(encoding="utf-8")
          before = '''    child
              .lock()
              .map_err(|_| "job lock was poisoned".to_string())?
              .kill()
              .map_err(|error| format!("unable to terminate job: {error}"))
          '''
          after = '''    let result = {
              let mut locked_child = child
                  .lock()
                  .map_err(|_| "job lock was poisoned".to_string())?;
              locked_child
                  .kill()
                  .map_err(|error| format!("unable to terminate job: {error}"))
          };
          result
          '''
          if after in rust:
              print("native cancellation lifetime is already repaired")
          elif before in rust:
              rust_path.write_text(rust.replace(before, after, 1), encoding="utf-8")
              print("repaired native cancellation lifetime")
          else:
              raise SystemExit("native cancellation block does not match either known state")

          test_path = Path("tests/unit/plugin-sdk.unit.test.ts")
          tests = test_path.read_text(encoding="utf-8")
          tests = tests.replace(
              "createSandboxedExecutor();",
              'createSandboxedExecutor({ isolation: "trusted-subprocess" });',
          )
          tests = tests.replace(
              "createSandboxedExecutor({ timeoutMs: 50 });",
              'createSandboxedExecutor({ isolation: "trusted-subprocess", timeoutMs: 50 });',
          )
          test_path.write_text(tests, encoding="utf-8")
          PY
          git config user.name "The Machine CI"
          git config user.email "ci@themachine.dev"
          git add apps/desktop/src-tauri/src/lib.rs tests/unit/plugin-sdk.unit.test.ts
          if git diff --cached --quiet; then
            echo "Source migrations are already synchronized."
          else
            git commit -m "fix: synchronize native lifetime and trusted plugin tests"
            git pull --rebase origin agent/production-readiness-remediation
            git push origin HEAD:agent/production-readiness-remediation
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.13.1"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.6.0
          run_install: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy

      - name: Install Linux WebKit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libssl-dev

      - name: Install frozen JavaScript workspace
        run: pnpm install --frozen-lockfile

      - name: Format synchronized sources
        run: |
          pnpm exec prettier --write \
            packages/service/src/handlers/repoHandler.ts \
            tests/unit/plugin-sdk.unit.test.ts
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Generate native dependency lock
        run: cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Commit generated lock and formatting
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "The Machine CI"
          git config user.email "ci@themachine.dev"
          git add \
            apps/desktop/src-tauri/Cargo.lock \
            apps/desktop/src-tauri/build.rs \
            apps/desktop/src-tauri/src/lib.rs \
            packages/service/src/handlers/repoHandler.ts \
            tests/unit/plugin-sdk.unit.test.ts
          if git diff --cached --quiet; then
            echo "Native lock and formatting are already synchronized."
          else
            git commit -m "build: lock and format native desktop dependencies"
            git pull --rebase origin agent/production-readiness-remediation
            git push origin HEAD:agent/production-readiness-remediation
          fi

      - name: Build native frontend
        run: pnpm --filter @the-machine/desktop build

      - name: Verify native bridge
        run: |
          pnpm exec prettier --check \
            packages/service/src/handlers/repoHandler.ts \
            tests/unit/plugin-sdk.unit.test.ts
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --all-targets -- -D warnings
          pnpm --filter @the-machine/desktop tauri build --no-bundle
          git diff --check
