name: One-shot native Cargo lockfile

on:
  push:
    branches:
      - codex/agentic-runtime-kaizen-v1
    paths:
      - .github/workflows/one-shot-cargo-lock.yml

permissions:
  contents: write

jobs:
  lock-and-verify:
    if: github.repository_owner == 'dominator509' && github.actor == 'dominator509'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
          run_install: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux WebKit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libssl-dev

      - name: Install frozen JavaScript workspace
        run: pnpm install --frozen-lockfile

      - name: Build native frontend
        run: pnpm --filter @the-machine/desktop build

      - name: Generate deterministic Rust lockfile
        run: cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Verify native bridge against the generated lockfile
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Commit Cargo.lock only after native verification passes
        run: |
          if git diff --quiet -- apps/desktop/src-tauri/Cargo.lock; then
            echo "Cargo.lock is already synchronized."
            exit 0
          fi
          git config user.name "The Machine CI"
          git config user.email "ci@themachine.dev"
          git add apps/desktop/src-tauri/Cargo.lock
          git commit -m "chore(desktop): lock native Rust dependencies"
          git pull --rebase origin codex/agentic-runtime-kaizen-v1
          git push origin HEAD:codex/agentic-runtime-kaizen-v1
