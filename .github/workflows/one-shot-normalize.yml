name: One-shot source normalization

on:
  push:
    branches:
      - codex/agentic-runtime-kaizen-v1
    paths:
      - package.json

permissions:
  contents: write

concurrency:
  group: machine-one-shot-normalize
  cancel-in-progress: true

jobs:
  normalize:
    if: github.repository_owner == 'dominator509' && github.actor == 'dominator509'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
          run_install: false

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Apply exact source corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("packages/observability/src/emit/emitToGUI.ts"): [
                  (
                      "    return out as { success: boolean; event: GuiEvent; reason?: string; validationErrors: string[]; };",
                      "    return out;",
                  ),
              ],
              Path("apps/desktop/src-tauri/src/lib.rs"): [
                  ("        request,\n        MachineRequest::Start", "        &request,\n        MachineRequest::Start"),
                  ("    let monitor_registry = registry.inner().clone();\n", ""),
              ],
          }

          for path, changes in replacements.items():
              text = path.read_text(encoding="utf-8")
              for before, after in changes:
                  if before not in text:
                      raise SystemExit(f"Expected source fragment missing in {path}: {before!r}")
                  text = text.replace(before, after, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Format TypeScript, JSON, YAML, HTML, CSS, and scripts
        run: |
          pnpm exec prettier --write \
            .github/workflows/ci.yml \
            .github/workflows/release.yml \
            .github/workflows/benchmark.yml \
            eslint.config.js \
            package.json \
            apps/cli/src/index.ts \
            apps/desktop/package.json \
            apps/desktop/tsconfig.json \
            apps/desktop/src/bridge.ts \
            apps/desktop/src/main.ts \
            apps/desktop/frontend/index.html \
            apps/desktop/frontend/styles.css \
            apps/desktop/scripts/build-frontend.mjs \
            apps/desktop/scripts/dev-server.mjs \
            apps/desktop/src-tauri/tauri.conf.json \
            apps/desktop/src-tauri/capabilities/default.json \
            packages/agent-runtime/src/index.ts \
            packages/agent-runtime/src/engine/index.ts \
            packages/agent-runtime/src/engine/presets.ts \
            packages/agent-runtime/src/engine/workers.ts \
            packages/agent-runtime/src/engine/console.ts \
            packages/observability/src/emit/emitToGUI.ts \
            benchmarks/suites/smoke.machine-bench.json \
            benchmarks/fixtures/javascript-addition/src/math.mjs \
            benchmarks/fixtures/javascript-addition/test.mjs \
            benchmarks/fixtures/greeting-normalizer/src/greeting.mjs \
            benchmarks/fixtures/greeting-normalizer/test.mjs \
            tools/benchmark/fixture-worker.mjs \
            tools/benchmark/benchmark.mjs \
            tests/unit/worker-presets.unit.test.ts \
            tests/integration/run-console.integration.test.ts

      - name: Format native bridge
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Commit bounded normalization
        run: |
          if git diff --quiet; then
            echo "Sources are already normalized."
            exit 0
          fi
          git config user.name "The Machine CI"
          git config user.email "ci@themachine.dev"
          git add \
            .github/workflows/ci.yml \
            .github/workflows/release.yml \
            .github/workflows/benchmark.yml \
            eslint.config.js \
            package.json \
            apps/cli/src/index.ts \
            apps/desktop \
            packages/agent-runtime/src \
            packages/observability/src/emit/emitToGUI.ts \
            benchmarks \
            tools/benchmark \
            tests/unit/worker-presets.unit.test.ts \
            tests/integration/run-console.integration.test.ts
          git commit -m "style: normalize desktop workers and benchmark tranche"
          git pull --rebase origin codex/agentic-runtime-kaizen-v1
          git push origin HEAD:codex/agentic-runtime-kaizen-v1
