name: Full repository security gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: machine-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.13.1"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.6.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Scan every tracked regular file and workflow policy
        run: node tools/security/check-repository.mjs
      - name: Audit locked production and development dependencies
        run: pnpm audit --audit-level high
