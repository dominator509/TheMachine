project_name: "TheMachine"

languages:
  - typescript
  - json
  - yaml
  - markdown

encoding: "utf-8"
line_ending: native
language_backend: LSP
ignore_all_files_in_gitignore: true

additional_workspace_folders:
  - apps/cli
  - apps/desktop
  - packages/agent-runtime
  - packages/core
  - packages/mcp
  - packages/observability
  - packages/plugin-sdk
  - packages/providers
  - packages/security
  - packages/service
  - packages/storage
  - packages/ui-components

ignored_paths:
  - node_modules/**
  - .pnpm-store/**
  - .turbo/**
  - "**/dist/**"
  - "**/build/**"
  - "**/*.tsbuildinfo"
  - release/**
  - coverage/**
  - test-results/**
  - playwright-report/**
  - .nyc_output/**
  - .machine/**
  - .serena/cache/**
  - .obsidian/workspace.json
  - tmp/**
  - screenshots/**
  - "**/*.log"
  - npm-debug.log*
  - pnpm-debug.log*

read_only: false
excluded_tools: []
included_optional_tools: []
fixed_tools: []
default_modes: []
added_modes: []
initial_prompt: "Repo-local TypeScript PNPM/Turbo monorepo. Start with AGENTS.md and REPO_BRIEF.md; keep edits scoped and use COMMANDS.md for validation."
symbol_info_budget: 30
read_only_memory_patterns: []
ignored_memory_patterns: []
