[package]
name = "the-machine-desktop"
version = "0.1.0"
edition = "2021"
description = "The Machine — Tauri v2 Desktop GUI"

[lib]
name = "the_machine_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "the-machine-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
