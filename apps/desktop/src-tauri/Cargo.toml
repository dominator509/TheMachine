[package]
name = "the-machine-desktop"
version = "0.3.0-alpha.1"
edition = "2021"
description = "Native run console for The Machine agentic software delivery control plane"
license = "MIT"

[lib]
name = "the_machine_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "the-machine-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
